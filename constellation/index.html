<style>

.node.compact .node-content{width:74%}

.tone-origin{--ring:#48d3e4;--glow:#48d3e444}.tone-green{--ring:#58d69a;--glow:#58d69a44}.tone-cyan{--ring:#48d3e4;--glow:#48d3e444}.tone-violet{--ring:#aa8cff;--glow:#aa8cff44}.tone-amber{--ring:#f4c56a;--glow:#f4c56a44}.tone-blue{--ring:#6d9cff;--glow:#6d9cff44}.tone-teal{--ring:#7ddec8;--glow:#7ddec844}.tone-pending{--ring:#9eb0c2;--glow:#9eb0c244}

<script>
const studyMatch = location.pathname.match(/^\/study\/(.+?)\/?$/);
const API = studyMatch ? "/api/studies/" + studyMatch[1].replace(/\/$/, "") : "";
function endpoint(name){ return API ? `${API}/${name}` : `/api/${name}`; }
function paintSky(){
  const sky = document.querySelector("#sky");
  if(!sky || sky.childElementCount) return;
  let seed = 20261013;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for(let i = 0; i < 168; i++){
    const star = document.createElement("i");
    const roll = rnd();
    const size = roll > 0.94 ? 2.2 : roll > 0.78 ? 1.6 : 1;
    const glow = size > 2 ? 3 : 0;
    star.style.left = `${(rnd() * 100).toFixed(2)}%`;
    star.style.top = `${(rnd() * 100).toFixed(2)}%`;
    star.style.width = star.style.height = `${size}px`;
    star.style.opacity = (0.16 + rnd() * (size > 2 ? 0.55 : 0.38)).toFixed(2);
    if(glow) star.style.boxShadow = `0 0 ${glow}px rgba(214,214,218,.45)`;
    sky.appendChild(star);
  }
}
paintSky();
const STATUS = {open:"未开始", in_progress:"进行中", resolved:"已完成", cancelled:"已取消"};
const REL = {parent:"子节点", audit:"审核", support:"支持", challenge:"挑战", error:"错误"};
const TOOL = {web_search:"搜索", web_fetch:"打开", bash:"命令", read_file:"读取", create_file:"写入", submit_report:"提交", download_file:"下载", "压缩":"压缩", "思考":"思考"};
const TITLE_COLOR = {web_search:"#60a5fa", web_fetch:"#2dd4bf", bash:"#fb923c", read_file:"#a3e635", create_file:"#f472b6", submit_report:"#e879f9", download_file:"#818cf8", "压缩":"#f9a8d4", "思考":"#fdba74"};
const MARK = {web_search:"#48d3e4", web_fetch:"#6d9cff", bash:"#8ea0b3", read_file:"#aa8cff", create_file:"#58d69a", submit_report:"#f4c56a", "压缩":"#7ddec8", "思考":"#48d3e4"};
let view = null;
let scale = 1;
let selected = null;
let selectionTransition = false;
let activeStep = null;
let fittedKey = "";
let holdScale = false;
let panX = 0;
let panY = 0;
let userMoved = false;
let chipHost = null;
let revealedFor = null;
let burstId = "";
let burstAt = 0;
let glideToken = 0;
const haloSeen = new Map();
const toneSeen = new Map();
let goalWorkStart = 0;
const BURST_STEP = 18;
const BURST_MS = 340;

function shortTitle(text){
  const cleaned = String(text || "").replace(/^#\s*Task\s*/i, "").trim();
  const sentence = cleaned.split(/[。\n]/)[0].trim() || cleaned;
  return sentence.length > 28 ? sentence.slice(0, 28) + "…" : sentence;
}

function boundsKey(){
  let maxX = 0, maxY = 0, count = 0;
  (view && view.nodes || []).forEach(node => {
    count += 1;
    maxX = Math.max(maxX, node.x + (node.radius || 0));
    maxY = Math.max(maxY, node.y + (node.radius || 0));
  });
  return `${count}:${Math.round(maxX)}:${Math.round(maxY)}`;
}

function applyTransform(){
  const transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  document.querySelector("#world").style.transform = transform;
  document.querySelector("#live-layer").style.transform = transform;
  const zoomLevel = document.querySelector("#zoom-level");
  const percentage = `${Math.round(scale * 100)}%`;
  if(zoomLevel.textContent !== percentage) zoomLevel.textContent = percentage;
}

function fit(){
  if(!view || !view.ok || !(view.nodes || []).length) return;
  const canvas = document.querySelector("#canvas");
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  view.nodes.forEach(node => {
    const radius = node.radius || view.radius || 58;
    minX = Math.min(minX, node.x - radius);
    minY = Math.min(minY, node.y - radius);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  const padX = 40;
  const padTop = 28;
  const padBottom = 72;
  const worldW = Math.max(1, maxX - minX);
  const worldH = Math.max(1, maxY - minY);
  const sx = Math.max(1, canvas.clientWidth - padX * 2) / worldW;
  const sy = Math.max(1, canvas.clientHeight - padTop - padBottom) / worldH;
  scale = Math.max(0.12, Math.min(1.15, Math.min(sx, sy)));
  panX = (canvas.clientWidth - worldW * scale) / 2 - minX * scale;
  panY = padTop + (canvas.clientHeight - padTop - padBottom - worldH * scale) / 2 - minY * scale;
}

function nodeById(id){return (view.nodes || []).find(node => node.id === id)}

function liveKey(source){
  return (source && source.nodes || []).map(node => `${node.id}:${(node.live || []).map(step => step.label).join("/")}`).join("|");
}

function sizeKey(source){
  return (source && source.nodes || []).map(node => `${node.id}:${node.radius}`).join("|");
}

function linkedIds(id){
  const ids = new Set([id]);
  (view.edges || []).forEach(edge => {
    if(edge.from === id || edge.to === id){
      ids.add(edge.from);
      ids.add(edge.to);
    }
  });
  return ids;
}

function nodeBounds(){
  let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
  (view.nodes || []).forEach(node => {
    const radius = node.radius || 58;
    minX = Math.min(minX, node.x - radius);
    minY = Math.min(minY, node.y - radius);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  return {minX, minY, maxX, maxY};
}

function rememberTip(el, step){
  const label = String((step && step.label) || "").trim();
  const matched = label.match(/^【([^】]+)】(.*)$/);
  const rest = (matched ? matched[2] : label).trim();
  const hint = String((step && step.hint) || "").trim();
  el.dataset.tipAction = matched ? matched[1] : "";
  el.dataset.tip = hint.length > rest.length ? hint : (rest || hint);
  el.removeAttribute("title");
}

function fillLabel(parent, label){
  const matched = String(label || "").match(/^【([^】]+)】(.*)$/);
  parent.textContent = "";
  if(!matched){
    parent.textContent = label;
    return;
  }
  const action = document.createElement("b");
  action.className = "act";
  action.textContent = `【${matched[1]}】`;
  parent.append(action);
  if(matched[2]) parent.append(document.createTextNode(matched[2]));
}

function chipBox(step){
  const label = String(step.label || step.tool || "");
  let text = 0;
  for(const ch of label) text += ch.charCodeAt(0) > 255 ? 13 : 7.1;
  if((step.count || 1) > 1) text += 32;
  const screenW = Math.min(280, Math.max(108, Math.ceil(text + 42)));
  return {w: screenW / scale, h: 26 / scale};
}

function rectHitsCircle(rect, node, pad){
  const radius = (node.radius || 58) + pad;
  const nearestX = Math.max(rect.x, Math.min(node.x, rect.x + rect.w));
  const nearestY = Math.max(rect.y, Math.min(node.y, rect.y + rect.h));
  return Math.hypot(node.x - nearestX, node.y - nearestY) < radius;
}

function rectsOverlap(a, b, pad){
  return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y;
}

function placeChips(node, steps, occupied){
  const boxes = steps.map(chipBox);
  const gap = 8 / scale;
  const rowH = boxes[0].h;
  const radius = node.radius || 58;
  const margin = 16 / scale;
  const canvas = document.querySelector("#canvas");
  const frame = {
    left: (-panX + 12) / scale,
    top: (-panY + 12) / scale,
    right: (canvas.clientWidth - panX - 12) / scale,
    bottom: (canvas.clientHeight - panY - 76) / scale,
  };
  const rowsFit = Math.max(6, Math.floor((frame.bottom - frame.top) * 0.62 / (rowH + gap)));
  let useCols = boxes.length > rowsFit ? Math.ceil(boxes.length / rowsFit) : 1;
  useCols = Math.min(4, Math.max(1, useCols));
  if(useCols > 1){
    const maxW = Math.max(108 / scale, (frame.right - frame.left - gap * (useCols - 1)) / useCols);
    boxes.forEach(box => { box.w = Math.min(box.w, maxW); });
  }
  const colW = Math.max(...boxes.map(box => box.w));
  const rows = Math.ceil(boxes.length / useCols);
  const gridW = useCols * colW + (useCols - 1) * gap;
  const gridH = rows * rowH + (rows - 1) * gap;
  let best = null;
  let bestScore = Infinity;
  const bestCols = useCols;
  function clipped(rect){
    const ox = Math.max(0, frame.left - rect.x) + Math.max(0, rect.x + rect.w - frame.right);
    const oy = Math.max(0, frame.top - rect.y) + Math.max(0, rect.y + rect.h - frame.bottom);
    return ox + oy;
  }
  function consider(x, y){
    const rect = {x, y, w: gridW, h: gridH};
    const dist = Math.hypot(x + gridW / 2 - node.x, y + gridH / 2 - node.y);
    let score = dist + clipped(rect) * 18;
    view.nodes.forEach(other => { if(rectHitsCircle(rect, other, 10 / scale)) score += 8000; });
    (occupied || []).forEach(box => { if(rectsOverlap(rect, box, 8 / scale)) score += 5000; });
    if(score < bestScore){ bestScore = score; best = {x, y}; }
  }
  const slide = rowH + gap;
  const shifts = [0, 1, -1, 2, -2, 3, -3];
  for(let ring = 0; ring < 10; ring++){
    const dist = margin + ring * (22 / scale);
    shifts.forEach(nudge => {
      const shift = nudge * slide * 0.7;
      consider(node.x + radius + dist, node.y - gridH / 2 + shift);
      consider(node.x - radius - dist - gridW, node.y - gridH / 2 + shift);
      consider(node.x - gridW / 2 + shift, node.y - radius - dist - gridH);
      consider(node.x - gridW / 2 + shift, node.y + radius + dist);
    });
  }
  if(!best) best = {x: node.x + radius + margin, y: node.y - gridH / 2};
  const spots = boxes.map((box, index) => {
    const col = index % bestCols;
    const row = Math.floor(index / bestCols);
    return {
      x: best.x + col * (colW + gap),
      y: best.y + row * (rowH + gap),
      w: box.w,
      h: box.h,
    };
  });
  spots.forEach(spot => (occupied || []).push(spot));
  return spots;
}

function placeOne(node, step, occupied){
  const box = chipBox(step);
  const radius = node.radius || 58;
  const gap = 12 / scale;
  const canvas = document.querySelector("#canvas");
  const frame = {
    left: (-panX + 12) / scale,
    top: (-panY + 12) / scale,
    right: (canvas.clientWidth - panX - 12) / scale,
    bottom: (canvas.clientHeight - panY - 76) / scale,
  };
  let best = null;
  let bestDist = Infinity;
  let fallback = null;
  let fallbackScore = Infinity;
  const reach = radius + Math.max(box.w, box.h) + 280;
  for(let ring = 0; ring < 16; ring++){
    const dist = radius + gap + box.h / 2 + ring * (20 / scale);
    if(dist > reach && best) break;
    for(let stepIndex = 0; stepIndex < 16; stepIndex++){
      const angle = -Math.PI / 2 + stepIndex * (Math.PI * 2 / 16) + ring * 0.22;
      const cx = node.x + Math.cos(angle) * dist;
      const cy = node.y + Math.sin(angle) * dist;
      const rect = {x: cx - box.w / 2, y: cy - box.h / 2, w: box.w, h: box.h};
      let nodesHit = 0;
      let chipsHit = 0;
      view.nodes.forEach(other => { if(rectHitsCircle(rect, other, 12 / scale)) nodesHit += 1; });
      (occupied || []).forEach(prev => { if(rectsOverlap(rect, prev, 8 / scale)) chipsHit += 1; });
      const ox = Math.max(0, frame.left - rect.x) + Math.max(0, rect.x + rect.w - frame.right);
      const oy = Math.max(0, frame.top - rect.y) + Math.max(0, rect.y + rect.h - frame.bottom);
      const clip = ox + oy;
      const centerDist = Math.hypot(cx - node.x, cy - node.y);
      if(nodesHit === 0 && chipsHit === 0 && clip < 1 && centerDist < bestDist){
        bestDist = centerDist;
        best = rect;
      }
      const score = centerDist + nodesHit * 8000 + chipsHit * 5000 + clip * 18;
      if(score < fallbackScore){
        fallbackScore = score;
        fallback = rect;
      }
    }
  }
  const spot = best || fallback || {x: node.x + radius + gap, y: node.y - box.h / 2, w: box.w, h: box.h};
  (occupied || []).push(spot);
  return spot;
}

function glidePan(nextX, nextY){
  const token = ++glideToken;
  const fromX = panX;
  const fromY = panY;
  const start = performance.now();
  const duration = 760;
  function frame(now){
    if(token !== glideToken) return;
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    panX = fromX + (nextX - fromX) * eased;
    panY = fromY + (nextY - fromY) * eased;
    applyTransform();
    if(t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function revealChips(node, spots){
  if(!spots.length || revealedFor === node.id) return;
  revealedFor = node.id;
  const canvas = document.querySelector("#canvas");
  const pad = 16;
  const bottomPad = 76;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  spots.forEach(spot => {
    minX = Math.min(minX, spot.x);
    minY = Math.min(minY, spot.y);
    maxX = Math.max(maxX, spot.x + spot.w);
    maxY = Math.max(maxY, spot.y + spot.h);
  });
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  let nextX = panX;
  let nextY = panY;
  const left = nextX + minX * scale;
  const right = nextX + maxX * scale;
  const top = nextY + minY * scale;
  const bottom = nextY + maxY * scale;
  if(right - left <= width - pad * 2){
    if(right > width - pad) nextX -= right - (width - pad);
    if(nextX + minX * scale < pad) nextX += pad - (nextX + minX * scale);
  } else {
    nextX = pad - minX * scale;
  }
  if(bottom - top <= height - pad - bottomPad){
    if(bottom > height - bottomPad) nextY -= bottom - (height - bottomPad);
    if(nextY + minY * scale < pad) nextY += pad - (nextY + minY * scale);
  } else {
    nextY = pad - minY * scale;
  }
  userMoved = true;
  holdScale = true;
  if(Math.hypot(nextX - panX, nextY - panY) < 2) return;
  const token = ++glideToken;
  setTimeout(() => {
    if(token !== glideToken) return;
    glidePan(nextX, nextY);
  }, 180);
}

function toolCount(node){
  const done = (node.steps || []).length;
  const live = (node.live || []).filter(step => step.tool && step.tool !== "思考").length;
  return done + live;
}

function awaitingAgent(node){
  return !node.goal && node.status !== "cancelled" && node.status !== "resolved" && !(node.agents && node.agents.length) && toolCount(node) === 0;
}

function goalIsWorking(node){
  if(!node.goal || !view || !view.running) return false;
  return !(view.nodes || []).some(item => !item.goal);
}

function ringAmount(node, calls){
  if(node.status === "cancelled") return 0;
  if(node.goal){
    if(!goalIsWorking(node)) return 0;
    if(!goalWorkStart) goalWorkStart = performance.now();
    const elapsed = (performance.now() - goalWorkStart) / 45000;
    return Math.min(0.78, 0.18 + elapsed * 0.6);
  }
  if(!goalIsWorking({goal:true}) ) goalWorkStart = 0;
  if(node.status === "resolved") return 1;
  if(awaitingAgent(node)) return 0.28;
  if(node.status !== "in_progress" && calls <= 0) return 0;
  const grown = Math.min(0.88, 1 - 1 / (1 + calls / 7));
  return node.status === "in_progress" ? Math.max(0.1, grown) : grown;
}

let goalTicker = 0;
function ensureGoalTicker(){
  if(goalTicker) return;
  const step = () => {
    const arc = document.querySelector(".node.working .halo .arc");
    if(!arc || !arc.dataset.circ){
      goalTicker = 0;
      return;
    }
    const elapsed = (performance.now() - goalWorkStart) / 45000;
    const amount = Math.min(0.78, 0.18 + elapsed * 0.6);
    const circ = Number(arc.dataset.circ);
    arc.style.strokeDasharray = `${(amount * circ).toFixed(2)} ${circ.toFixed(2)}`;
    goalTicker = requestAnimationFrame(step);
  };
  goalTicker = requestAnimationFrame(step);
}

function burstDelay(id, index){
  if(burstId !== id) return -1e9;
  return index * BURST_STEP - (performance.now() - burstAt);
}

const liveChips = new Map();
const liveSpokes = new Map();

function liveIdentity(node, step, nth){
  return [node.id, step.tool || "", step.label || "", String(nth)].join("\u001f");
}

function styleChip(el, spot){
  el.style.left = `${spot.x}px`;
  el.style.top = `${spot.y}px`;
  el.style.width = `${spot.w}px`;
  el.style.height = `${spot.h}px`;
  el.style.padding = `0 ${10 / scale}px`;
  el.style.gap = `${6 / scale}px`;
  el.style.borderRadius = `${spot.h / 2}px`;
  el.style.fontSize = `${12 / scale}px`;
}

function chipAnchor(node, spot){
  const cx = spot.x + spot.w / 2;
  const cy = spot.y + spot.h / 2;
  const horizontal = Math.abs(cx - node.x) >= Math.abs(cy - node.y);
  const x2 = horizontal ? (cx >= node.x ? spot.x : spot.x + spot.w) : cx;
  const y2 = horizontal ? cy : (cy >= node.y ? spot.y : spot.y + spot.h);
  return {x2, y2};
}

function clearLive(){
  liveChips.clear();
  liveSpokes.clear();
  const layer = document.querySelector("#live-layer");
  if(layer) layer.replaceChildren();
}

function retreatChip(el){
  const node = nodeById(el.dataset.node);
  el.classList.remove("burst");
  if(!node){
    el.remove();
    return;
  }
  const x = parseFloat(el.style.left) || node.x;
  const y = parseFloat(el.style.top) || node.y;
  const w = parseFloat(el.style.width) || 0;
  const h = parseFloat(el.style.height) || 0;
  el.style.setProperty("--from-x", `${(node.x - (x + w / 2)).toFixed(1)}px`);
  el.style.setProperty("--from-y", `${(node.y - (y + h / 2)).toFixed(1)}px`);
  el.classList.add("retreat");
  const done = () => el.remove();
  el.addEventListener("animationend", done, {once: true});
  setTimeout(done, 420);
}

function makeLiveChip(node, step, spot){
  const el = document.createElement("button");
  el.type = "button";
  el.className = `satellite live tool-${step.tool} tone-${node.tone || "blue"} burst`;
  el.dataset.node = node.id;
  el.style.setProperty("--from-x", `${(node.x - (spot.x + spot.w / 2)).toFixed(1)}px`);
  el.style.setProperty("--from-y", `${(node.y - (spot.y + spot.h / 2)).toFixed(1)}px`);
  styleChip(el, spot);
  rememberTip(el, step);
  const mark = document.createElement("i");
  mark.className = "mark";
  mark.style.width = mark.style.height = `${6 / scale}px`;
  const text = document.createElement("span");
  fillLabel(text, step.label || TOOL[step.tool] || step.tool);
  el.append(mark, text);
  el.addEventListener("animationend", () => el.classList.remove("burst"), {once: true});
  el.addEventListener("click", event => {
    event.stopPropagation();
    select(node.id, null);
  });
  return el;
}

function liveSpokeSvg(){
  const layer = document.querySelector("#live-layer");
  let svg = layer.querySelector("svg.live-spokes");
  if(svg) return svg;
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges live-spokes");
  svg.setAttribute("width", "4000");
  svg.setAttribute("height", "4000");
  layer.prepend(svg);
  return svg;
}

function paintSpoke(line, node, spot, step, radiusOf, emerge){
  const {x2, y2} = chipAnchor(node, spot);
  const dx = x2 - node.x, dy = y2 - node.y, len = Math.hypot(dx, dy) || 1;
  const radius = radiusOf(node);
  line.setAttribute("stroke", MARK[step.tool] || "#9ec9d6");
  line.setAttribute("x1", (node.x + dx / len * radius).toFixed(1));
  line.setAttribute("y1", (node.y + dy / len * radius).toFixed(1));
  line.setAttribute("x2", x2.toFixed(1));
  line.setAttribute("y2", y2.toFixed(1));
  if(emerge) line.setAttribute("class", "spoke burst");
}

function syncLive(items, radiusOf){
  const layer = document.querySelector("#live-layer");
  const svg = liveSpokeSvg();
  const wanted = new Map();
  items.forEach(item => {
    const seen = new Map();
    item.spots.forEach((spot, index) => {
      const step = item.node.live[index];
      const base = `${step.tool}|${step.label}`;
      const nth = seen.get(base) || 0;
      seen.set(base, nth + 1);
      wanted.set(liveIdentity(item.node, step, nth), {node: item.node, step, spot});
    });
  });
  for(const [key, el] of [...liveChips]){
    if(wanted.has(key)) continue;
    liveChips.delete(key);
    retreatChip(el);
    const line = liveSpokes.get(key);
    liveSpokes.delete(key);
    if(!line) continue;
    line.setAttribute("class", "spoke retreat");
    const drop = () => line.remove();
    line.addEventListener("animationend", drop, {once: true});
    setTimeout(drop, 420);
  }
  wanted.forEach((item, key) => {
    const existing = liveChips.get(key);
    if(existing){
      styleChip(existing, item.spot);
      const line = liveSpokes.get(key);
      if(line) paintSpoke(line, item.node, item.spot, item.step, radiusOf, false);
      return;
    }
    const el = makeLiveChip(item.node, item.step, item.spot);
    liveChips.set(key, el);
    layer.appendChild(el);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    paintSpoke(line, item.node, item.spot, item.step, radiusOf, true);
    svg.appendChild(line);
    liveSpokes.set(key, line);
  });
}

function draw(){
  hideChipTip();
  document.querySelector(".app").classList.toggle("has-selection", Boolean(selected));
  const animateSelection = selectionTransition && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  selectionTransition = false;
  const drawer = document.querySelector(".drawer");
  if(animateSelection && selected){
    const node = nodeById(selected);

    drawer.style.setProperty("--focus-y", `${focusY}px`);
    drawer.style.setProperty("--drawer-dy", `${Math.max(-16,Math.min(16,(focusY - canvasHeight / 2) * .08))}px`);
    drawer.classList.remove("focus-in");

    drawer.classList.add("focus-in");
  } else if(!selected){

  const radiusOf = node => node.radius || view.radius || 58;

  view.nodes.forEach(node => {
    const radius = radiusOf(node);
    maxX = Math.max(maxX, node.x + radius);
    maxY = Math.max(maxY, node.y + radius);
  });
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "edges");
  svg.setAttribute("width", String(maxX + 140));
  svg.setAttribute("height", String(maxY + 140));
  const bends = {parent: 36, audit: -78, support: 58, challenge: -64, error: -96};
  const shownRelation = edge => edge.relation === "fusion" ? "audit" : edge.relation;
  const parentCount = {};
  const sameTarget = {};
  (view.edges || []).forEach(edge => {
    const relation = shownRelation(edge);
    if(relation === "parent") parentCount[edge.from] = (parentCount[edge.from] || 0) + 1;
    const key = `${relation}:${edge.to}`;
    sameTarget[key] = (sameTarget[key] || 0) + 1;
  });
  (view.edges || []).forEach((edge, index) => {
    const from = nodeById(edge.from), to = nodeById(edge.to);
    if(!from || !to) return;
    const dx = to.x - from.x, dy = to.y - from.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const x1 = from.x + ux * radiusOf(from), y1 = from.y + uy * radiusOf(from);
    const x2 = to.x - ux * radiusOf(to), y2 = to.y - uy * radiusOf(to);
    const relation = shownRelation(edge);
    const bend = (bends[relation] || 40) + (index % 4) * 10;
    const mx = (x1 + x2) / 2 - uy * bend;
    const my = (y1 + y2) / 2 + ux * bend;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const hot = !selected || edge.from === selected || edge.to === selected;
    path.setAttribute("class", `edge ${relation}${hot ? "" : " dim"}`);
    path.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    svg.appendChild(path);
    if(animateSelection && hot){
      const trace = path.cloneNode();
      trace.setAttribute("class", `edge ${relation} focus-trace`);
      trace.setAttribute("pathLength", "1");
      svg.appendChild(trace);
    }
    const crowded = (relation === "parent" && parentCount[edge.from] > 3) || sameTarget[`${relation}:${edge.to}`] > 4;
    if(crowded) return;
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", `edge-label${hot ? "" : " dim"}`);
    label.setAttribute("x", mx.toFixed(1));
    label.setAttribute("y", (my - 6).toFixed(1));
    label.setAttribute("text-anchor", "middle");
    label.textContent = REL[relation] || relation;
    svg.appendChild(label);
  });
  const focus = selected ? nodeById(selected) : null;
  const occupied = [];
  const spots = focus && focus.steps && focus.steps.length ? placeChips(focus, focus.steps, occupied) : [];
  if(focus && spots.length) revealChips(focus, spots);
  applyTransform();
  const arrive = Boolean(selected && selected !== chipHost);
  if(arrive){
    burstId = selected;
    burstAt = performance.now();
  }
  if(selected) chipHost = selected;
  else chipHost = null;
  const liveNodes = (view.nodes || []).filter(node => node.live && node.live.length && node.id !== selected);
  const livePlaced = liveNodes.map(node => ({
    node,
    spots: node.live.map(step => placeOne(node, step, occupied)),
  }));
  if(spots.length){
    const gridLeft = Math.min(...spots.map(spot => spot.x));
    const gridRight = Math.max(...spots.map(spot => spot.x + spot.w));
    const gridTop = Math.min(...spots.map(spot => spot.y));
    const gridBottom = Math.max(...spots.map(spot => spot.y + spot.h));
    const horizontal = Math.abs((gridLeft + gridRight) / 2 - focus.x) >= Math.abs((gridTop + gridBottom) / 2 - focus.y);
    spots.forEach((spot, index) => {
      const step = focus.steps[index];
      const onInner = horizontal
        ? ((gridLeft + gridRight) / 2 >= focus.x ? Math.abs(spot.x - gridLeft) < 2 : Math.abs(spot.x + spot.w - gridRight) < 2)
        : ((gridTop + gridBottom) / 2 >= focus.y ? Math.abs(spot.y - gridTop) < 2 : Math.abs(spot.y + spot.h - gridBottom) < 2);
      if(!onInner) return;
      const x2 = horizontal ? ((gridLeft + gridRight) / 2 >= focus.x ? spot.x : spot.x + spot.w) : spot.x + spot.w / 2;
      const y2 = horizontal ? spot.y + spot.h / 2 : ((gridTop + gridBottom) / 2 >= focus.y ? spot.y : spot.y + spot.h);
      const dx = x2 - focus.x, dy = y2 - focus.y, len = Math.hypot(dx, dy) || 1;

      line.setAttribute("x2", x2.toFixed(1));
      line.setAttribute("y2", y2.toFixed(1));
      svg.appendChild(line);
    });

    el.className = `node tone-${tone} weight-${node.weight || "node"}${nodeRadius < 72 && !node.goal ? " compact" : ""}${node.status === "in_progress" ? " in_progress" : ""}${pending ? " pending" : ""}${working ? " working" : ""}${erroneous ? " erroneous" : ""}${fresh ? " arrive" : ""}${previousTone && previousTone !== tone ? " tone-arrive" : ""}${node.status === "cancelled" ? " cancelled" : ""}${selected === node.id ? " selected" : ""}${dim ? " dim" : ""}${animateSelection && selected === node.id ? " focus-in" : ""}${animateSelection && dim ? " focus-away" : ""}`;
    el.style.left = `${node.x - nodeRadius}px`;
    el.style.top = `${node.y - nodeRadius}px`;
    el.style.width = `${nodeRadius * 2}px`;
    el.style.height = `${nodeRadius * 2}px`;
    el.style.setProperty("--node-font", `${node.goal ? Math.min(17,Math.max(14,nodeRadius * .13)) : Math.min(14,Math.max(12,nodeRadius * .14))}px`);
    el.dataset.id = node.id;
    el.dataset.status = node.status || "";
    el.dataset.tip = node.title || "";
    el.dataset.tipAction = "";
    el.removeAttribute("title");
    const calls = toolCount(node);
    const stateText = node.goal ? (view.running ? "调研中" : "已结束") : erroneous ? "存在错误" : pending ? "待分配" : (STATUS[node.status] || "研究任务");
    const content = document.createElement("span");
    content.className = "node-content";
    const category = document.createElement("span");
    category.className = "node-kicker";
    category.textContent = node.goal ? "研究主问题" : "研究任务";
    const title = document.createElement("b");
    title.className = "node-title";
    title.textContent = node.title;
    content.append(category,title);
    if(node.goal){
      const summary = document.createElement("small");
      summary.className = "node-summary";
      summary.textContent = taskNodes.length ? `已完成 ${resolvedCount} / ${taskNodes.length} 项任务` : (view.running ? "正在拆解研究问题" : "尚无子任务");
      content.appendChild(summary);
    }
    const meta = document.createElement("small");
    meta.className = "node-meta";
    meta.textContent = node.goal ? (agentCount ? `${agentCount} 个研究智能体` : "等待任务分配") : `${calls} 次工具调用${node.children && node.children.length ? ` · ${node.children.length} 项子任务` : ""}`;
    content.appendChild(meta);
    const tab = document.createElement("span");
    tab.className = "node-tab";
    tab.textContent = stateText;
    tab.setAttribute("aria-hidden", "true");
    const identifier = document.createElement("span");
    identifier.className = "node-id";
    identifier.textContent = node.goal ? "Q" : String(node.id).toUpperCase();
    identifier.setAttribute("aria-hidden", "true");
    el.append(content,tab,identifier);
    el.setAttribute("aria-label", `${node.title}，${stateText}，${node.goal ? `${resolvedCount} 项任务已完成，共 ${taskNodes.length} 项` : `${calls} 次工具调用`}`);
    const amount = ringAmount(node, calls);
    if(amount > 0){
      const pad = 8;
      const stroke = 2.8;
      const size = nodeRadius * 2 + pad * 2;
      const radius = nodeRadius + pad - stroke;
      const center = size / 2;
      const circ = 2 * Math.PI * radius;
      const previous = haloSeen.has(node.id) ? haloSeen.get(node.id) : amount;
      haloSeen.set(node.id, amount);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "halo");
      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.style.left = `${-pad}px`;
      svg.style.top = `${-pad}px`;
      const track = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      track.setAttribute("class", "track");
      track.setAttribute("cx", center);
      track.setAttribute("cy", center);
      track.setAttribute("r", radius);
      const arc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      arc.setAttribute("class", "arc");
      arc.setAttribute("cx", center);
      arc.setAttribute("cy", center);
      arc.setAttribute("r", radius);
      arc.setAttribute("transform", `rotate(-90 ${center} ${center})`);
      arc.dataset.circ = circ.toFixed(2);
      const paint = value => {
        if(value >= 1){
          arc.style.strokeDasharray = "none";
          arc.style.strokeLinecap = "butt";
          return;
        }
        arc.style.strokeLinecap = "round";
        arc.style.strokeDasharray = `${(value * circ).toFixed(2)} ${circ.toFixed(2)}`;
      };
      paint(previous);
      svg.append(track, arc);
      el.appendChild(svg);
      if(Math.abs(previous - amount) > 0.004){
        requestAnimationFrame(() => {
          arc.style.transition = "stroke-dasharray .7s ease";
          paint(amount);
        });
      }
    }
    if(nodeRadius < 72 && node.status){
      const pip = document.createElement("i");
      pip.className = `pip ${node.status}`;
      el.appendChild(pip);
    }
    el.addEventListener("click", event => {
      event.stopPropagation();
      select(node.id, null);
    });
    world.appendChild(el);
  });
  spots.forEach((spot, index) => {
    const step = focus.steps[index];
    const el = document.createElement("button");
    el.type = "button";
    const delay = burstDelay(focus.id, index);
    const flying = delay > -BURST_MS;
    el.className = `satellite tool-${step.tool} tone-${focus.tone || "blue"}${step.error ? " bad" : ""}${activeStep === index ? " on" : ""}${flying ? " burst" : ""}`;
    if(flying){
      el.style.setProperty("--from-x", `${(focus.x - (spot.x + spot.w / 2)).toFixed(1)}px`);
      el.style.setProperty("--from-y", `${(focus.y - (spot.y + spot.h / 2)).toFixed(1)}px`);
      el.style.animationDelay = `${delay}ms`;
    }
    el.style.left = `${spot.x}px`;
    el.style.top = `${spot.y}px`;
    el.style.width = `${spot.w}px`;
    el.style.height = `${spot.h}px`;
    el.style.padding = `0 ${10 / scale}px`;
    el.style.gap = `${6 / scale}px`;
    el.style.borderRadius = `${spot.h / 2}px`;
    el.style.fontSize = `${12 / scale}px`;
    rememberTip(el, step);
    const mark = document.createElement("i");
    mark.className = "mark";
    mark.style.width = mark.style.height = `${6 / scale}px`;
      const text = document.createElement("span");
      fillLabel(text, step.label || TOOL[step.tool] || step.tool);
      el.append(mark, text);
      if((step.count || 1) > 1){
      const times = document.createElement("em");
      times.textContent = `×${step.count}`;
      times.style.fontSize = `${11 / scale}px`;
      el.append(times);
    }
    el.addEventListener("click", event => {
      event.stopPropagation();
      select(focus.id, index);
    });
    world.appendChild(el);
  });
  syncLive(livePlaced, radiusOf);
  ensureGoalTicker();
  resumeChipTip();
}

function childState(node){
  if(!node) return {state:"pending",label:"准备中"};
  if(node.status === "resolved") return {state:"resolved",label:"已完成"};
  if(node.status === "cancelled") return {state:"cancelled",label:"已取消"};
  if(awaitingAgent(node)) return {state:"pending",label:view && view.running === false ? "待开始" : "准备中"};
  if(node.status === "in_progress" || (node.live || []).length){
    return view && view.running === false ? {state:"cancelled",label:"已停止"} : {state:"working",label:"工作中"};
  }
  return {state:"pending",label:view && view.running === false ? "待开始" : "准备中"};
}

function renderChildren(node){
  const host = document.querySelector("#children");
  const entries = (node.children || []).map(child => {
    const match = nodeById(child.id);
    return {id:child.id,title:child.title || "未命名任务",tone:(match && match.tone) || "pending",...childState(match)};
  });
  const signature = JSON.stringify([node.id,entries]);
  if(host.dataset.signature === signature) return;
  host.dataset.signature = signature;
  host.replaceChildren();
  if(!entries.length){
    host.textContent = "没有子任务";
    return;
  }
  entries.forEach((child,index) => {
    const row = document.createElement("button");
    row.type = "button";
    row.className = `child tone-${child.tone} state-${child.state}`;
    row.style.setProperty("--child-delay", `${-index * .37}s`);
    row.setAttribute("aria-label", `${child.title}，${child.label}`);
    const icon = document.createElement("span");
    icon.className = "child-icon";
    icon.setAttribute("aria-hidden", "true");
    if(child.state === "resolved") icon.innerHTML = '<svg viewBox="0 0 16 16"><path d="m4 8 2.5 2.5L12 5"/></svg>';
    else if(child.state === "cancelled") icon.innerHTML = '<svg viewBox="0 0 16 16"><path d="M5 8h6"/></svg>';
    const copy = document.createElement("span");
    copy.className = "child-copy";
    const title = document.createElement("span");
    title.className = "child-title";
    title.textContent = child.title;
    const status = document.createElement("small");
    status.className = "child-status";
    status.textContent = child.label;
    copy.append(title,status);
    row.append(icon,copy);
    row.addEventListener("click", () => select(child.id,null));
    host.appendChild(row);
  });
}

function clearSelection(){
  selected = null;
  selectionTransition = false;
  activeStep = null;
  chipHost = null;
  revealedFor = null;
  burstId = "";
  document.querySelector("#back-goal").hidden = true;
  document.querySelector("#kind").hidden = true;
  document.querySelector("#kind").textContent = "";
  document.querySelector("#title").textContent = "点选一个节点";
  document.querySelector("#agents").hidden = true;
  document.querySelector("#agents").textContent = "";
  document.querySelector("#status").textContent = "—";
  document.querySelector("#notes").textContent = "—";
  document.querySelector("#children").textContent = "—";
  delete document.querySelector("#children").dataset.signature;
  document.querySelector("#steps").textContent = "—";
  draw();
}

function select(id, stepIndex){
  if(selected !== id) activeStep = null;
  selectionTransition = selected !== id;
  selected = id;
  if(arguments.length > 1) activeStep = stepIndex;
  const node = nodeById(id);
  if(!node){
    clearSelection();
    return;
  }
  const step = activeStep != null && node.steps ? node.steps[activeStep] : null;
  const goal = Boolean(node.goal);
  document.querySelector("#back-goal").hidden = goal;
  document.querySelector("#kind").hidden = !step;
  document.querySelector("#agents").hidden = true;
  document.querySelector("#status-section").hidden = goal;
  document.querySelector("#notes-section").hidden = goal;
  document.querySelector("#steps-section").hidden = goal;
  document.querySelector("#kind").textContent = step ? (TOOL[step.tool] || "步骤") : "";
  document.querySelector("#kind").style.color = step ? (TITLE_COLOR[step.tool] || "#e5e5e5") : "";
  document.querySelector("#title").textContent = step ? (step.label || step.tool) : (node.title || "");
  document.querySelector("#agents").textContent = "";
  document.querySelector("#status").textContent = goal ? "" : (STATUS[node.status] || node.status || "—");
  document.querySelector("#notes").textContent = node.notes || (goal ? "" : "还没有备注");
  renderChildren(node);
  const steps = document.querySelector("#steps");
  steps.innerHTML = "";
  if(!node.steps || !node.steps.length) steps.textContent = "没有工具步骤";
  else node.steps.forEach((item, index) => {
    const row = document.createElement("div");
    row.className = `step${activeStep === index ? " on" : ""}`;
    const who = document.createElement("small");
    who.style.color = TITLE_COLOR[item.tool] || "#e5e5e5";
    who.textContent = `${TOOL[item.tool] || "步骤"}${item.count > 1 ? " ×" + item.count : ""}${item.error ? " · 失败" : ""}`;
    row.appendChild(who);
    if(item.label){
      const summary = document.createElement("b");
      summary.textContent = item.label;
      row.appendChild(summary);
    }
    row.appendChild(document.createTextNode(item.detail || ""));
    row.addEventListener("click", () => select(id, index));
    steps.appendChild(row);
  });
  draw();
  const current = document.querySelector("#steps .step.on");
  if(current) current.scrollIntoView({block: "nearest"});
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

function labelBefore(gap){
  const pipe = gap.lastIndexOf("|");
  if(pipe >= 0){
    const picked = labelInside(gap.slice(pipe + 1));
    return {keep: gap.slice(0, pipe + 1) + picked.keep, text: picked.text};
  }
  return labelInside(gap);
}

function labelInside(gap){
  if(/来源\s*[:：]\s*$/.test(gap)) return {keep: gap.replace(/来源\s*[:：]\s*$/, ""), text: "来源"};
  if(/\s*[—–]\s*$/.test(gap) || /\s+-\s+$/.test(gap)){
    const nl = gap.lastIndexOf("\n");
    const line = nl >= 0 ? gap.slice(nl + 1) : gap;
    const head = nl >= 0 ? gap.slice(0, nl + 1) : "";
    const num = line.match(/^\s*\d+\.\s+/);
    const body = line.replace(/^\s*\d+\.\s+/, "").replace(/\s*[—–-]\s*$/, "").trim();
    if(body && body.length <= 120) return {keep: head + (num ? num[0] : ""), text: body};
  }
  const delim = /[；;。！？\n：:（(，,、]/g;
  let cut = 0;
  let found;
  while((found = delim.exec(gap))) cut = found.index + found[0].length;
  const tail = gap.slice(cut).trim();
  if(tail && tail.length <= 80) return {keep: gap.slice(0, cut), text: tail};
  return {keep: gap.replace(/[ \t]*$/, ""), text: "来源"};
}

function foldUrls(source){
  const found = [];
  const re = /https?:\/\/[^\s<）)，。；、]+/g;
  let match;
  while((match = re.exec(source))){
    if(match.index >= 2 && source[match.index - 2] === "]" && source[match.index - 1] === "(") continue;
    const href = match[0].replace(/[.,;:]+$/, "");
    found.push({start: match.index, end: match.index + match[0].length, href, trailing: match[0].slice(href.length)});
  }
  if(!found.length) return source;
  let out = "";
  let cursor = 0;
  for(const item of found){
    const picked = labelBefore(source.slice(cursor, item.start));
    const href = item.href.replace(/\(/g, "%28").replace(/\)/g, "%29");
    let text = picked.text.replace(/[\[\]*]/g, "").replace(/\|/g, "").trim();
    if(!text || text === "来源" || /^https?:\/\//i.test(text)) text = linkHost(href) || "原文";
    out += picked.keep + "[" + text + "](" + href + ")" + item.trailing;
    cursor = item.end;
  }
  return out + source.slice(cursor);
}

function linkHost(href){
  try { return new URL(href).host.replace(/^www\./, ""); }
  catch(error){ return ""; }
}

function inlineMarkdown(source){
  const text = String(source);
  let html = "";
  let i = 0;
  while(i < text.length){
    if(text.startsWith("**", i)){
      const end = text.indexOf("**", i + 2);
      if(end !== -1){
        html += "<strong>" + inlineMarkdown(text.slice(i + 2, end)) + "</strong>";
        i = end + 2;
        continue;
      }
    }
    if(text[i] === "`"){
      const end = text.indexOf("`", i + 1);
      if(end > i + 1){
        html += "<code>" + escapeHtml(text.slice(i + 1, end)) + "</code>";
        i = end + 1;
        continue;
      }
    }
    const link = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/.exec(text.slice(i));
    if(link){
      const host = linkHost(link[2]);
      html += '<a href="' + escapeHtml(link[2]) + '" target="_blank" rel="noopener noreferrer"' + (host ? ' title="' + escapeHtml(host) + '"' : "") + ">" + inlineMarkdown(link[1]) + "</a>";
      i += link[0].length;
      continue;
    }
    const url = /^https?:\/\/[^\s<）)，。；、]+/.exec(text.slice(i));
    if(url){
      const href = url[0].replace(/[.,;:]+$/, "");
      html += '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(href) + "</a>" + escapeHtml(url[0].slice(href.length));
      i += url[0].length;
      continue;
    }
    html += escapeHtml(text[i]);
    i += 1;
  }
  return html;
}

function joinParagraph(parts){
  return parts.reduce((acc, part) => {
    if(!acc) return part;
    const cjk = /[\u3400-\u9fff]$/.test(acc) && /^[\u3400-\u9fff]/.test(part);
    return acc + (cjk ? "" : " ") + part;
  }, "");
}

function splitCells(line){
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
}

function isTableRule(line){
  return /^\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)+\|?$/.test(line.trim());
}

function tableAlign(cell){
  const text = cell.trim();
  if(text.startsWith(":") && text.endsWith(":")) return "center";
  if(text.endsWith(":")) return "right";
  return "";
}

function chapterTitle(body){
  if(/Completeness Check|Correctness Check|Deliverable Check/.test(body)) return "证据核对";
  const scope = /^Scope:\s*([^\n]+)/m.exec(body);
  if(scope){
    let title = scope[1].split(/[。.]/)[0];
    title = title.replace(/^研究\s*/, "").replace(/，采用[\s\S]*$/, "").replace(/，方法[\s\S]*$/, "").replace(/。$/, "").trim();
    const lead = title.split(/[：:]/)[0].trim();
    if(lead.length >= 6 && lead.length <= 28) return lead;
    if(title.length >= 6 && title.length <= 28) return title;
  }
  const head = /^\*\*\d+\.\s+([^*\n]+)\*\*\s*$/m.exec(body) || /^【\d+\.\s+([^】\n]+)】\s*$/m.exec(body);
  if(head) return head[1].replace(/（RETRIEVED[^）]*）/g, "").trim();
  const plain = /^\d+\.\s+([^：:—\n]{2,22})/m.exec(body);
  if(plain) return plain[1].trim();
  return "研究发现";
}

function scopeLede(body){
  const found = /^Scope:\s*([^\n]+)/m.exec(body);
  if(!found) return "";
  let text = found[1].split(/。/)[0];
  text = text.replace(/采用[\s\S]*$/, "").replace(/方法[:：][\s\S]*$/, "").replace(/产出[\s\S]*$/, "").trim();
  if(!text || text.length > 90) return "";
  return text.endsWith("。") ? text : text + "。";
}

function cleanEvidenceLine(line){
  const trimmed = line.trim();
  if(/\/Users\/|sandbox\/worktree|产出文件/.test(trimmed)) return null;
  const evidence = /^-\s+(https?:\/\/\S+(?:\s*(?:与|and)\s*https?:\/\/\S+)*)\s*[—–-]\s*(.+)$/.exec(trimmed);
  if(!evidence) return line;
  const desc = evidence[2].replace(/\s*quality:\s*\S+(?:\s*[（(][^）)]*[）)])?/i, "").replace(/[\[\]]/g, "").trim() || "来源";
  const urls = evidence[1].match(/https?:\/\/\S+/g).map(href => href.replace(/[，,;；。]+$/, ""));
  return urls.map(href => "- [" + desc + "](" + href + ")").join("\n");
}

function cleanChapter(body){
  let text = String(body || "").replace(/\r\n/g, "\n").trim();
  if(!text || (/^\[NOTE:/.test(text) && text.length < 900)) return "";
  text = text.replace(/\[NOTE:[^\]]*\]\s*/g, "");
  text = text.replace(/\s*quality:\s*[A-Za-z/]+(?:\s*[（(][^）)\n]*[）)])?/gi, "");
  const title = chapterTitle(text);
  const lede = scopeLede(text);
  text = text.replace(/^Scope:\s*[^\n]*\n*/m, "");
  text = text.replace(/^Findings:\s*\n*/m, "");
  text = text.replace(/（RETRIEVED[^）]*）/g, "");
  text = text.replace(/^\*\*(\d+\.\s*[^*]+)\*\*\s*$/gm, "### $1");
  text = text.replace(/^【(\d+\.\s*[^】]+)】\s*$/gm, "### $1");
  text = text.replace(/^Evidence:\s*$/m, "### 来源");
  text = text.replace(/^Confidence:\s*/m, "> **判断** ");
  text = text.replace(/^Unresolved:\s*$/m, "### 尚未确认");
  text = text.replace(/^Disconfirming:\s*/m, "> **相反证据** ");
  text = text.replace(/^Conflicts:\s*/m, "> **分歧** ");
  text = text.replace(/^##\s+Completeness Check\s*$/m, "### 完整性");
  text = text.replace(/^##\s+Correctness Check\s*$/m, "### 正确性");
  text = text.replace(/^##\s+Precision Issues\s*$/m, "### 精度");
  text = text.replace(/^##\s+Discipline Issues[^\n]*$/m, "### 写法");
  text = text.replace(/^##\s+Deliverable Check\s*$/m, "### 交付");
  if(title && title !== "研究发现"){
    const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    text = text.replace(new RegExp("^###\\s+(?:\\d+\\.\\s+)?" + escaped + "\\s*$", "m"), "");
  }
  const lines = text.split("\n").map(cleanEvidenceLine).filter(line => line !== null);
  text = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  if(!text) return "";
  return "## " + title + "\n\n" + (lede ? lede + "\n\n" : "") + text;
}

function prepareUserReport(source, title){
  const raw = String(source || "").replace(/\r\n/g, "\n");
  const chapters = [];
  const reports = /<report\b([^>]*)>([\s\S]*?)<\/report>/gi;
  let match;
  while((match = reports.exec(raw))){
    const status = (/\bstatus="([^"]*)"/.exec(match[1] || "") || [])[1] || "";
    if(status === "incomplete") continue;
    const chapter = cleanChapter(match[2]);
    if(chapter) chapters.push(chapter);
  }
  let body = chapters.length ? chapters.join("\n\n") : raw.replace(/^##\s+Best-effort collected results[\s\S]*?(?=\n#|\n<report|$)/, "").trim();
  if(chapters.length) body = body.replace(/^#\s+/gm, "## ");
  const heading = String(title || "").trim();
  const usable = heading && heading !== "正在读取" && heading !== "这份运行没有星图";
  if(chapters.length && usable) body = "# " + heading + "\n\n" + body;
  return body;
}

function leadBold(item){
  if(/^\*\*/.test(item) || /^\[/.test(item)) return item;
  const labeled = /^(.{2,18}?)([：:])/.exec(item);
  if(labeled && !/https?:/.test(labeled[1])) return "**" + labeled[1] + "**" + labeled[2] + item.slice(labeled[0].length);
  const cjk = /^([\u3400-\u9fff]{2,4})/.exec(item);
  if(cjk && item.length > cjk[1].length + 8) return "**" + cjk[1] + "**" + item.slice(cjk[1].length);
  return item;
}

function splitLongItem(item){
  const marks = item.split("；").length - 1;
  if(item.length < 220 || marks < 2) return [item];
  return item.split("；").map(part => part.trim()).filter(Boolean);
}

function plainLength(cell){
  return String(cell || "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[*`]/g, "").trim().length;
}

function columnKind(header, samples){
  const name = String(header || "").replace(/\*/g, "").replace(/\s+/g, "");
  const longest = Math.max(name.length, ...samples.map(plainLength));
  if(/来源|出处|链接|参考/.test(name)) return "source";
  if(/^(日期|时间)$/.test(name)) return longest <= 28 ? "date" : "text";
  const dated = samples.filter(cell => /^\d{4}-\d{2}-\d{2}$/.test(String(cell || "").trim())).length;
  if(name.length <= 4 && longest <= 28 && dated >= Math.max(1, samples.filter(Boolean).length * 0.6)) return "date";
  if(longest > 0 && longest <= 8) return "label";
  return "text";
}

function cellNumeric(cell){
  const text = String(cell || "").replace(/\*\*/g, "").trim();
  if(!text || text.length > 28) return false;
  const digits = (text.match(/\d/g) || []).length;
  return digits > 0 && !/[\u3400-\u9fff]{3,}/.test(text) && !/[A-Za-z]{5,}/.test(text);
}

function tableWidthPlan(headers,rows,kinds){
  const measure = cell => {
    const text = String(cell || "").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*`]/g,"");
    return [...text].reduce((width,char) => width + (char === " " ? 3.5 : char.codePointAt(0) > 255 ? 14 : 7),0);
  };
  const profiles = headers.map((header,index) => {
    const longest = Math.max(measure(header),...rows.map(row => measure(row[index])));
    const clamp = (min,value,max) => Math.max(min,Math.min(max,Math.ceil(value)));
    switch(kinds[index]){
      case "source": return {minimum:160,weight:clamp(160,longest * .6 + 28,232)};
      case "date": return {minimum:136,weight:clamp(136,longest * .65 + 28,208)};
      case "num": {
        const width = clamp(104,longest + 28,224);
        return {minimum:width,weight:width};
      }
      case "label": return {minimum:104,weight:clamp(104,longest + 28,168)};
      default: return {minimum:180,weight:clamp(180,longest * .55 + 28,360)};
    }
  });
  const total = profiles.reduce((sum,column) => sum + column.weight,0);
  let assigned = 0;
  const columns = profiles.map((column,index) => {
    const percentage = index === profiles.length - 1 ? Number((100 - assigned).toFixed(3)) : Number((column.weight / total * 100).toFixed(3));
    assigned += percentage;
    return percentage;
  });
  // With a fixed table layout, this floor keeps every column at or above its
  // readable minimum. Narrow containers scroll instead of shrinking the cells.
  const minimum = Math.ceil(Math.max(...profiles.map((column,index) => column.minimum * 100 / columns[index])));
  return {minimum,columns};
}

function renderMarkdown(source){
  source = foldUrls(source);
  const lines = String(source).replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  let i = 0;
  while(i < lines.length){
    const trimmed = lines[i].trim();
    if(!trimmed){ i += 1; continue; }
    const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
    if(heading){
      const level = heading[1].length;
      blocks.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      i += 1;
      continue;
    }
    if(/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)){
      blocks.push("<hr>");
      i += 1;
      continue;
    }
    if(trimmed.startsWith("```")){
      const code = [];
      i += 1;
      while(i < lines.length && !lines[i].trim().startsWith("```")){
        code.push(lines[i]);
        i += 1;
      }
      if(i < lines.length) i += 1;
      blocks.push("<pre><code>" + escapeHtml(code.join("\n")) + "</code></pre>");
      continue;
    }
    if(trimmed.startsWith(">")){
      const paragraphs = [];
      let current = [];
      while(i < lines.length && lines[i].trim().startsWith(">")){
        const content = lines[i].trim().replace(/^>\s?/, "");
        if(!content){
          if(current.length) paragraphs.push(joinParagraph(current));
          current = [];
        } else current.push(content);
        i += 1;
      }
      if(current.length) paragraphs.push(joinParagraph(current));
      blocks.push("<blockquote>" + paragraphs.map(part => "<p>" + inlineMarkdown(part) + "</p>").join("") + "</blockquote>");
      continue;
    }
    if(trimmed.startsWith("|") && i + 1 < lines.length && isTableRule(lines[i + 1])){
      const head = splitCells(trimmed);
      const align = splitCells(lines[i + 1]).map(tableAlign);
      i += 2;
      const rows = [];
      while(i < lines.length && lines[i].trim().startsWith("|")){
        const cells = splitCells(lines[i]);
        rows.push(head.map((_,index) => index === head.length - 1 ? cells.slice(index).join(" | ") : (cells[index] || "")));
        i += 1;
      }
      const kinds = head.map((header, index) => columnKind(header, rows.map(row => row[index] || "")));
      const numeric = head.map((_, index) => {
        if(["date","source"].includes(kinds[index]) || /^(日期|时间)$/.test(head[index].replace(/[*\s]/g,""))) return false;
        const samples = rows.map(row => row[index] || "").filter(Boolean);
        if(!samples.length) return false;
        const hits = samples.filter(cellNumeric).length;
        return hits / samples.length >= 0.6;
      });
      const columnTypes = kinds.map((kind,index) => numeric[index] ? "num" : kind);
      const layout = tableWidthPlan(head,rows,columnTypes);
      const aligned = (tag, cell, index) => {
        const kind = columnTypes[index] || "text";
        const alignment = align[index] || (numeric[index] ? "right" : "");
        const style = alignment ? ' style="text-align:' + alignment + '"' : "";
        return "<" + tag + ' class="' + kind + '"' + style + ">" + inlineMarkdown(cell) + "</" + tag + ">";
      };
      const th = head.map((cell, index) => aligned("th", cell, index)).join("");
      const body = rows.map(row => "<tr>" + row.map((cell, index) => aligned("td", cell, index)).join("") + "</tr>").join("");
      const columns = layout.columns.map(width => '<col style="width:' + width + '%">').join("");
      const name = escapeHtml("表格：" + head.join("、"));
      blocks.push('<div class="table-wrap" role="region" aria-label="' + name + '" tabindex="0"><table style="min-width:' + layout.minimum + 'px"><colgroup>' + columns + '</colgroup><thead><tr>' + th + "</tr></thead><tbody>" + body + "</tbody></table></div>");
      continue;
    }
    if(/^[-*]\s+/.test(trimmed)){
      const items = [];
      while(i < lines.length && /^[-*]\s+/.test(lines[i].trim())){
        const raw = lines[i].trim().replace(/^[-*]\s+/, "");
        splitLongItem(raw).forEach(part => {
          const only = /^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(part.trim());
          if(only){
            const host = linkHost(only[2]);
            items.push('<li class="source"><a class="bookmark" href="' + escapeHtml(only[2]) + '" target="_blank" rel="noopener noreferrer"><b>' + inlineMarkdown(only[1]) + "</b>" + (host ? "<small>" + escapeHtml(host) + "</small>" : "") + "</a></li>");
            return;
          }
          items.push("<li>" + inlineMarkdown(leadBold(part)) + "</li>");
        });
        i += 1;
      }
      blocks.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    if(/^\d+\.\s+/.test(trimmed)){
      const items = [];
      while(i < lines.length && /^\d+\.\s+/.test(lines[i].trim())){
        items.push("<li>" + inlineMarkdown(lines[i].trim().replace(/^\d+\.\s+/, "")) + "</li>");
        i += 1;
      }
      blocks.push("<ol>" + items.join("") + "</ol>");
      continue;
    }
    const para = [trimmed];
    i += 1;
    while(i < lines.length){
      const next = lines[i].trim();
      if(!next || /^(#{1,6})\s+/.test(next) || /^(---|```)/.test(next) || next.startsWith(">") || next.startsWith("|") || /^[-*]\s+/.test(next) || /^\d+\.\s+/.test(next)) break;
      para.push(next);
      i += 1;
    }
    blocks.push("<p>" + inlineMarkdown(joinParagraph(para)) + "</p>");
  }
  return blocks.join("");
}

function closeReport(){
  const modal = document.querySelector("#modal");
  if(!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  document.querySelector("#open-report").focus();
}

async function openReport(){
  const body = document.querySelector("#report-body");
  const researchTitle = (view && view.goal && view.goal.title) || document.querySelector("#goal-text").textContent;
  document.querySelector("#report-title").textContent = researchTitle && !["正在读取","这份运行没有星图"].includes(researchTitle) ? researchTitle : "研究报告";
  body.innerHTML = '<p class="report-status">正在读取报告</p>';
  body.scrollTop = 0;
  document.querySelector("#modal").classList.add("open");
  document.querySelector("#close-report").focus();
  try {
    const response = await fetch(endpoint("report"));
    const text = await response.text();
    if(!response.ok){
      body.innerHTML = '<p class="report-status">' + escapeHtml(text || "这份运行还没有报告。") + "</p>";
      return;
    }
    body.innerHTML = renderMarkdown(prepareUserReport(text,researchTitle));
    body.scrollTop = 0;
  } catch (error) {
    body.innerHTML = '<p class="report-status">报告没有读出来。刷新后再打开一次。</p>';
  }
}

let tipTimer = 0;
let tipAnchor = null;
const pointer = {x: 0, y: 0, inside: false};

function hideChipTip(){
  clearTimeout(tipTimer);
  tipTimer = 0;
  tipAnchor = null;
  document.querySelector("#chip-tip").classList.remove("show");
}

function placeChipTip(anchor){
  const tip = document.querySelector("#chip-tip");
  const canvas = document.querySelector("#canvas").getBoundingClientRect();
  const host = anchor.getBoundingClientRect();
  const box = tip.getBoundingClientRect();
  const gap = 8;
  let left = host.left + host.width / 2 - box.width / 2;
  left = Math.max(canvas.left + 12, Math.min(left, canvas.right - box.width - 12));
  let top = host.top - box.height - gap;
  if(top < canvas.top + 8) top = host.bottom + gap;
  if(top + box.height > canvas.bottom - 8) top = Math.max(canvas.top + 8, host.top - box.height - gap);
  tip.style.left = `${Math.round(left)}px`;
  tip.style.top = `${Math.round(top)}px`;
}

function wantsTip(el){
  const body = (el.dataset.tip || "").trim();
  if(!body) return false;
  const text = el.querySelector(".node-title") || el.querySelector("span, b");
  if(text && (text.scrollWidth > text.clientWidth + 1 || text.scrollHeight > text.clientHeight + 1)) return true;
  const visible = (text ? text.textContent : "").replace(/\s+/g, "");
  return body.replace(/\s+/g, "").length > visible.length;
}

function openChipTip(el){
  if(!el.isConnected || !wantsTip(el)){
    hideChipTip();
    return;
  }
  const tip = document.querySelector("#chip-tip");
  const action = el.dataset.tipAction || "";
  const body = el.dataset.tip || "";
  const frame = document.querySelector("#canvas").getBoundingClientRect();
  tip.style.maxWidth = `${Math.max(180, Math.min(300, frame.width - 24))}px`;
  tip.replaceChildren();
  tip.style.setProperty("--mark", getComputedStyle(el).getPropertyValue("--mark").trim() || "#9ec9d6");
  if(action){
    const lead = document.createElement("b");
    lead.textContent = action;
    tip.append(lead);
  }
  const text = document.createElement("span");
  text.textContent = body;
  tip.append(text);
  tipAnchor = el;
  placeChipTip(el);
  tip.classList.add("show");
}

function scheduleChipTip(el, delay){
  clearTimeout(tipTimer);
  tipAnchor = el;
  tipTimer = setTimeout(() => openChipTip(el), delay);
}

function resumeChipTip(){
  if(!pointer.inside) return;
  const hit = document.elementFromPoint(pointer.x, pointer.y);
  const el = hit && hit.closest && hit.closest("button.satellite, button.node");
  if(el) scheduleChipTip(el, 160);
}

function resetView(){
  glideToken += 1;
  userMoved = false;
  holdScale = false;
  revealedFor = selected;
  fit();
  fittedKey = boundsKey();
  draw();
}

function backToGoal(){
  select("goal", null);
  resetView();
}
document.querySelector("#back-goal").addEventListener("click", backToGoal);
document.querySelector("#open-report").addEventListener("click", openReport);
document.querySelector("#close-report").addEventListener("click", closeReport);
document.querySelector("#modal").addEventListener("click", event => { if(event.target.id === "modal") closeReport(); });
document.addEventListener("keydown", event => { if(event.key === "Escape") closeReport(); });
document.querySelector("#zoom-in").addEventListener("click", () => {userMoved = true; holdScale = true; scale = Math.min(2, scale + 0.1); draw()});
document.querySelector("#zoom-out").addEventListener("click", () => {userMoved = true; holdScale = true; scale = Math.max(0.12, scale - 0.1); draw()});
document.querySelector("#zoom-fit").addEventListener("click", backToGoal);
window.addEventListener("resize", () => {
  if(!view || !view.ok || holdScale) return;
  fit();
  draw();
});
let drag = null;
let suppressClick = false;
const canvasEl = document.querySelector("#canvas");
canvasEl.addEventListener("pointerover", event => {
  pointer.inside = true;
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  const el = event.target.closest("button.satellite, button.node");
  if(!el){
    if(tipAnchor) hideChipTip();
    return;
  }
  if(el === tipAnchor && document.querySelector("#chip-tip").classList.contains("show")) return;
  scheduleChipTip(el, 220);
});
canvasEl.addEventListener("pointermove", event => {
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  if(tipAnchor && document.querySelector("#chip-tip").classList.contains("show")) placeChipTip(tipAnchor);
});
canvasEl.addEventListener("pointerout", event => {
  const from = event.target.closest("button.satellite, button.node");
  if(!from || (event.relatedTarget && from.contains(event.relatedTarget))) return;
  if(!tipAnchor || tipAnchor === from) hideChipTip();
});
canvasEl.addEventListener("pointerleave", () => {
  pointer.inside = false;
  hideChipTip();
});
canvasEl.addEventListener("focusin", event => {
  const el = event.target.closest("button.satellite, button.node");
  if(el) scheduleChipTip(el, 0);
});
canvasEl.addEventListener("focusout", event => {
  const el = event.target.closest("button.satellite, button.node");
  if(el && (!tipAnchor || tipAnchor === el)) hideChipTip();
});
canvasEl.addEventListener("pointerdown", () => hideChipTip(), true);
canvasEl.addEventListener("pointerdown", event => {
  if(event.button !== 0) return;
  if(event.target.closest(".node, .satellite, .zoom, .legend")) return;
  drag = {id: event.pointerId, x: event.clientX, y: event.clientY, panX, panY, moved: false};
  canvasEl.setPointerCapture(event.pointerId);
});
canvasEl.addEventListener("pointermove", event => {
  if(!drag || event.pointerId !== drag.id) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if(!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  glideToken += 1;
  canvasEl.classList.add("panning");
  panX = drag.panX + dx;
  panY = drag.panY + dy;
  userMoved = true;
  holdScale = true;
  applyTransform();
});
function endDrag(event){
  if(!drag || event.pointerId !== drag.id) return;
  if(drag.moved) suppressClick = true;
  drag = null;
  canvasEl.classList.remove("panning");
}
canvasEl.addEventListener("pointerup", endDrag);
canvasEl.addEventListener("pointercancel", endDrag);
canvasEl.addEventListener("wheel", event => {
  event.preventDefault();
  glideToken += 1;
  const rect = canvasEl.getBoundingClientRect();
  const sx = event.clientX - rect.left;
  const sy = event.clientY - rect.top;
  if(event.ctrlKey || event.metaKey){
    const next = Math.max(0.12, Math.min(2, scale * (event.deltaY < 0 ? 1.08 : 0.92)));
    const wx = (sx - panX) / scale;
    const wy = (sy - panY) / scale;
    scale = next;
    panX = sx - wx * scale;
    panY = sy - wy * scale;
  } else {
    panX -= event.deltaX;
    panY -= event.deltaY;
  }
  userMoved = true;
  holdScale = true;
  applyTransform();
}, {passive: false});
canvasEl.addEventListener("click", event => {
  if(suppressClick){ suppressClick = false; return; }
  if(event.target.closest(".node, .satellite, .zoom, .legend")) return;
  if(selected) clearSelection();
});

async function refresh(){
  try {
    const payload = await fetch(endpoint("view")).then(response => response.json());
    const structural = !view || payload.version !== view.version || payload.ok !== view.ok || payload.message !== view.message;
    const activity = liveKey(payload) !== liveKey(view) || sizeKey(payload) !== sizeKey(view);
    view = payload;
    if(selected){
      const parent = nodeById(selected);
      if(parent) renderChildren(parent);
    }
    const key = view.ok ? boundsKey() : "";
    const refit = Boolean(key && key !== fittedKey);
    if(refit){
      if(!userMoved) fit();
      fittedKey = key;
    }
    if(structural || refit){
      if(selected && !(view.nodes || []).some(node => node.id === selected)) selected = null;
      if(selected) select(selected);
      else draw();
    } else if(activity){
      draw();
    }
  } catch (error) {
    view = {ok:false, message:"星图服务没有返回数据。"};
    draw();
  }
}
refresh();
setInterval(refresh, 1000);
</script>
